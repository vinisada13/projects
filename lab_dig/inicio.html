<body onload="iniciar()"  class="inicioclass">

        <h1 id="inicio">
            Aperte o botão de iniciar do aparelho
        </h1>
    </div>
    </div>
        </div>
    <div class="pl-container">
    <button class="paleta" onclick="setTheme('theme-night')" id="pl4"></button>
    <button class="paleta" onclick="setTheme('theme-default')" id="pl1"></button>
    <button class="paleta" onclick="setTheme('theme-ocean')" id="pl2"></button>

<script src="script.js"></script>
<!--<style src = "style.css"></style>-->
<script>
    function setTheme(themeName) {
    document.body.className = themeName;

    // save theme (important for kids → consistency)
    localStorage.setItem("theme", themeName);
}
</script>
<style>
    .inicioclass{
        background-color: rgb(100,120,180);
    }
</style>
